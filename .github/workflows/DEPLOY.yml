name: DEPLOY

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Configure SSH key
        run: |
          mkdir -p "$HOME/.ssh"
          echo "${{ secrets.GSS }}" > "$HOME/.ssh/key"
          chmod 600 "$HOME/.ssh/key"

      - name: Rsync plugin to production
        working-directory: globus-debug-control
        run: |
          export SSHPASS='${{ secrets.SSH_PASSWORD }}'
          rsync -e "sshpass -e ssh -p ${{ secrets.SSH_PORT }} -i $HOME/.ssh/key -o StrictHostKeyChecking=no" \
            --archive --compress --update . \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_PATH }}"
