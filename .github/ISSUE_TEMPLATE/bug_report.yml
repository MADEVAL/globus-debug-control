name: Bug report
description: Something in the plugin does not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please check the
        [support forum](https://wordpress.org/support/plugin/globus-debug-control/)
        and existing issues first.

  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: "2.2.6"
    validations:
      required: true

  - type: input
    id: wp-version
    attributes:
      label: WordPress version
      placeholder: "6.9.11"
    validations:
      required: true

  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: "8.3.14"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Settings -> GLOBUS Debug Control
        2. Go to the Cron Tasks tab
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Relevant debug.log lines
      description: Remove credentials, paths, and other sensitive data before posting.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and the support forum.
          required: true
        - label: This is not a security issue (those go through SECURITY.md).
          required: true
